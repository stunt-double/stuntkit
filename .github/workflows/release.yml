name: Release

on:
  push:
    branches: [main]
  # Re-runs the publish step by hand, for example after configuring a trusted
  # publisher on npm. It only publishes versions npm does not already have.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (and provenance) exchanges a GitHub OIDC token for
  # a short-lived publish token, so the repository holds no npm secret.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    if: github.repository == 'stunt-double/stuntkit'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No `registry-url`: it writes an .npmrc holding `${NODE_AUTH_TOKEN}`,
      # and an empty token there stops the OIDC exchange from being tried.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      # With pending changesets this opens (or updates) the "Version packages"
      # pull request. Merging that pull request runs this again with nothing
      # pending, and `pnpm release` builds and publishes whatever is unpublished,
      # then tags each published version and creates its GitHub release.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unset normally: publishing uses npm trusted publishing. Set it only
          # to bootstrap a package npm has never seen (a trusted publisher can
          # only be added to an existing package), then delete the secret.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
