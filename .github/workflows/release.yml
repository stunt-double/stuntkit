name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Publishing to GitHub Packages. Swap back to `id-token: write` (npm
  # provenance) when releases move to npm.
  packages: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    if: github.repository == 'stunt-double/stuntkit'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Until npm releases the @stdbl scope, packages go to GitHub Packages
          # as @stunt-double/*; see scripts/github-packages.ts.
          registry-url: https://npm.pkg.github.com
          scope: '@stunt-double'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      # With pending changesets this opens (or updates) the "Version packages"
      # pull request. Merging that pull request runs this again with nothing
      # pending, and `pnpm release` builds and publishes whatever is unpublished.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release:github
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
