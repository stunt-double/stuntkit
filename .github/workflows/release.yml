name: Release

on:
  push:
    branches: [main]
  # Re-runs the publish step by hand. It only publishes versions the registry
  # does not already have.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Until the @stunt-double scope is available on npm, packages publish to
  # GitHub Packages with GITHUB_TOKEN. Swap back to `id-token: write` (npm
  # trusted publishing and provenance) when releases move to npm.
  packages: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # A manual run can target any branch, so only `main` may publish.
    if: github.repository == 'stunt-double/stuntkit' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # Writes an .npmrc that sends @stunt-double to GitHub Packages with
      # NODE_AUTH_TOKEN. Drop `registry-url` and `scope` when moving to npm:
      # an empty token there stops the OIDC exchange from being tried.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@stunt-double'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      # With pending changesets this opens (or updates) the "Version packages"
      # pull request. Merging that pull request runs this again with nothing
      # pending, and `pnpm release` builds and publishes whatever is unpublished,
      # then tags each published version and creates its GitHub release.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
