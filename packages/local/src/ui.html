<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stunt Double Local</title>
    <style>
      /* Continuity, ported from Stunt Double's @stuntdouble/ui (globals.css and
         motion.css): the semantic tokens, radii, type stacks and motion tiers
         this page uses, under the same names. Untitled Sans is a licensed face
         that cannot ship in an open source package, and this page loads
         nothing from the network, so the sans is the token's own system
         fallback. Geist Mono and Space Grotesk are used when installed. */
      :root {
        color-scheme: light dark;
        --background: oklch(0.985 0.005 250);
        --foreground: oklch(0.18 0.016 268);
        --card: oklch(1 0 0);
        --secondary: oklch(0.945 0.009 255);
        --secondary-foreground: oklch(0.22 0.016 268);
        --muted: oklch(0.955 0.007 255);
        --muted-foreground: oklch(0.46 0.017 268);
        --accent: oklch(0.945 0.02 255);
        --accent-foreground: oklch(0.22 0.016 268);
        --primary: oklch(0.52 0.22 268);
        --primary-foreground: oklch(0.985 0.005 250);
        --destructive: oklch(0.53 0.215 22);
        --border: oklch(0.88 0.01 255);
        --input: oklch(0.86 0.01 255);
        --ring: oklch(0.52 0.22 268);
        --success: oklch(0.6 0.13 160);
        --success-ink: oklch(0.52 0.12 160);
        --warning: oklch(0.75 0.15 75);
        --warning-ink: oklch(0.52 0.13 70);

        --radius-md: 0.25rem;
        --radius-lg: 0.375rem;

        --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono:
          'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        --font-display: 'Space Grotesk', var(--font-sans);

        --ease-snap: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-glide: cubic-bezier(0.77, 0, 0.175, 1);
        --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        --duration-press: 140ms;
        --duration-quick: 180ms;
        --duration-base: 250ms;
        --duration-slow: 360ms;

        /* The primary button's light (.button-arc). */
        --button-fill-lit: color-mix(in oklab, var(--primary) 92%, var(--foreground));
        --button-lamp: oklch(1 0 0 / 0.24);
        --button-specular: oklch(1 0 0 / 0.28);
        --button-specular-lit: oklch(1 0 0 / 0.46);
        --button-shade: oklch(0.255 0.11 268 / 0.38);
        --button-rim: oklch(0.32 0.15 268 / 0.5);
        --button-shadow:
          0 1px 1px oklch(0.25 0.03 265 / 0.14), 0 2px 5px -2px oklch(0.25 0.03 265 / 0.22);
        --button-shadow-lit:
          0 1px 1px oklch(0.25 0.03 265 / 0.16), 0 5px 12px -5px oklch(0.25 0.03 265 / 0.34);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.14 0.014 265);
          --foreground: oklch(0.95 0.006 250);
          --card: oklch(0.17 0.014 265);
          --secondary: oklch(0.22 0.014 265);
          --secondary-foreground: oklch(0.95 0.006 250);
          --muted: oklch(0.22 0.014 265);
          --muted-foreground: oklch(0.68 0.014 250);
          --accent: oklch(0.24 0.018 265);
          --accent-foreground: oklch(0.95 0.006 250);
          --primary: oklch(0.68 0.165 276);
          --primary-foreground: oklch(0.14 0.014 265);
          --destructive: oklch(0.64 0.2 22);
          --border: oklch(0.95 0.006 250 / 0.1);
          --input: oklch(0.95 0.006 250 / 0.12);
          --ring: oklch(0.68 0.165 276);
          --success: oklch(0.68 0.14 160);
          --success-ink: oklch(0.72 0.14 160);
          --warning: oklch(0.82 0.15 75);
          --warning-ink: oklch(0.82 0.15 75);

          --button-lamp: oklch(1 0 0 / 0.3);
          --button-specular: oklch(1 0 0 / 0.4);
          --button-specular-lit: oklch(1 0 0 / 0.6);
          --button-shade: oklch(0.2 0.08 272 / 0.3);
          --button-rim: oklch(1 0 0 / 0.1);
          --button-shadow: 0 1px 1px oklch(0 0 0 / 0.5), 0 2px 6px -2px oklch(0 0 0 / 0.5);
          --button-shadow-lit: 0 1px 1px oklch(0 0 0 / 0.5), 0 5px 14px -5px oklch(0 0 0 / 0.65);
        }
      }

      /* ── Base ─────────────────────────────────────────────── */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font: 400 14px/1.5 var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-weight: 500;
        text-wrap: balance;
      }
      p,
      li {
        text-wrap: pretty;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
      }
      ul,
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      ::selection {
        background-color: var(--primary);
        color: var(--primary-foreground);
      }
      /* A full-bleed row inside a clipped group draws its ring inside. */
      .group :focus-visible {
        outline-offset: -2px;
      }
      code,
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums lining-nums;
      }
      svg.icon {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .truncate {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Chrome ───────────────────────────────────────────── */
      .container {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding-inline: 1rem;
      }
      /* The narrow tier, kept on the chrome's left edge. */
      .container.narrow > * {
        max-width: 48rem;
      }
      @media (min-width: 40rem) {
        .container {
          padding-inline: 1.5rem;
        }
      }
      @media (min-width: 64rem) {
        .container {
          padding-inline: 2rem;
        }
      }
      .bar {
        border-bottom: 1px solid var(--border);
        background: var(--background);
      }
      .bar .container {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 2rem;
        min-height: 3.5rem;
        padding-block: 0.5rem;
      }
      .product {
        font-weight: 500;
        letter-spacing: -0.012em;
        white-space: nowrap;
      }
      .bar nav {
        display: flex;
        gap: 0.25rem;
        margin-inline: -0.5rem;
      }
      .bar nav a {
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius-md);
        color: var(--muted-foreground);
        text-decoration: none;
        white-space: nowrap;
        transition: color var(--duration-quick) ease;
      }
      .bar nav a:hover {
        color: var(--foreground);
      }
      .bar nav a[aria-current='page'] {
        color: var(--foreground);
        background: var(--accent);
      }
      main {
        flex: 1;
        padding-block: 2rem 4rem;
      }
      @media (min-width: 40rem) {
        main {
          padding-block: 2.5rem 5rem;
        }
      }
      footer {
        border-top: 1px solid var(--border);
        padding-block: 1.5rem 2rem;
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      footer p {
        max-width: 42rem;
      }
      footer a,
      .link {
        color: var(--foreground);
        text-underline-offset: 3px;
        text-decoration-color: var(--border);
        transition: text-decoration-color var(--duration-quick) ease;
      }
      footer a:hover,
      .link:hover {
        text-decoration-color: currentColor;
      }

      /* ── Page header (PageHeader, PageTitle) ──────────────── */
      .page-header {
        margin-bottom: 2rem;
      }
      @media (min-width: 40rem) {
        .page-header {
          margin-bottom: 2.5rem;
        }
      }
      .back {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      .back a {
        display: inline-flex;
        flex-shrink: 0;
        align-items: center;
        gap: 0.375rem;
        text-decoration: none;
        transition: color var(--duration-quick) ease;
      }
      .back a:hover {
        color: var(--foreground);
      }
      .back .slash {
        color: var(--border);
      }
      .header-grid {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem 1.5rem;
      }
      .header-main {
        min-width: 0;
        display: grid;
        gap: 0.5rem;
      }
      .title-row {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem 0.75rem;
      }
      .page-title {
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      @media (min-width: 40rem) {
        .page-title {
          font-size: 2.25rem;
        }
      }
      .description {
        max-width: 42rem;
        color: var(--muted-foreground);
      }
      @media (min-width: 40rem) {
        .description {
          font-size: 1rem;
        }
      }
      .actions {
        display: flex;
        max-width: 100%;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .chips {
        display: flex;
        max-width: 42rem;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem;
        padding-top: 0.25rem;
      }
      .chips > li {
        min-width: 0;
        max-width: 100%;
      }
      /* The outline badge at its large size, in the quiet ink: a fact, not a state. */
      .chip {
        display: inline-flex;
        max-width: 100%;
        height: 1.5rem;
        align-items: center;
        gap: 0.25rem;
        padding: 0.125rem 0.625rem;
        border: 1px solid var(--border);
        border-radius: 9999px;
        font-size: 0.6875rem;
        color: var(--muted-foreground);
        text-decoration: none;
        white-space: nowrap;
        transition:
          color var(--duration-quick) var(--ease-snap),
          border-color var(--duration-quick) var(--ease-snap);
      }
      .chip svg.icon {
        width: 0.75rem;
        height: 0.75rem;
      }
      a.chip:hover {
        color: var(--foreground);
        border-color: color-mix(in oklch, var(--foreground) 25%, transparent);
      }
      @media (min-width: 40rem) {
        .chips {
          gap: 0.5rem;
        }
        .chip {
          height: 1.75rem;
          gap: 0.375rem;
          padding: 0.25rem 0.75rem;
          font-size: 0.75rem;
        }
        .chip svg.icon {
          width: 0.875rem;
          height: 0.875rem;
        }
      }

      /* ── Badge ────────────────────────────────────────────── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.125rem 0.625rem;
        border: 1px solid transparent;
        border-radius: 9999px;
        font-size: 0.6875rem;
        font-weight: 500;
        line-height: 1.4;
        white-space: nowrap;
      }
      .badge svg.icon {
        width: 0.75rem;
        height: 0.75rem;
      }
      .badge.lg {
        gap: 0.375rem;
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
      }
      .badge.lg svg.icon {
        width: 0.875rem;
        height: 0.875rem;
      }
      .badge.sm {
        padding: 1px 0.5rem;
        font-size: 0.625rem;
      }
      .badge.outline {
        border-color: var(--border);
        color: var(--foreground);
      }
      .badge.secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      /* Skipped, waiting and stopped: the product's muted override. */
      .badge.quiet {
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .badge.success {
        border-color: color-mix(in oklch, var(--success) 35%, transparent);
        background: color-mix(in oklch, var(--success) 8%, transparent);
        color: var(--success-ink);
      }
      .badge.warning {
        border-color: color-mix(in oklch, var(--warning) 40%, transparent);
        background: color-mix(in oklch, var(--warning) 10%, transparent);
        color: var(--warning-ink);
      }
      .badge.destructive {
        border-color: color-mix(in oklch, var(--destructive) 30%, transparent);
        background: color-mix(in oklch, var(--destructive) 8%, transparent);
        color: var(--destructive);
      }
      .badge.arc {
        border-color: color-mix(in oklch, var(--primary) 25%, transparent);
        background: color-mix(in oklch, var(--primary) 8%, transparent);
        color: var(--primary);
      }
      /* The `.stamp` motif pressed off square, in the colour it is given. */
      .badge.stamp {
        padding: 0.25rem 0.75rem;
        border: 1.25px solid currentColor;
        background: transparent;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transform: rotate(-1.5deg);
        opacity: 0.9;
      }
      .bulb {
        display: inline-block;
        width: 0.375rem;
        height: 0.375rem;
        flex-shrink: 0;
        border-radius: 9999px;
        background: currentColor;
      }
      /* Ambient status loops (this and .chase) run past the 360ms ceiling on
         purpose: they are motion.css's --animate-tally and .marquee-chase, not
         transitions, and they stop under prefers-reduced-motion. */
      .bulb.live {
        animation: marquee-dot 1.6s ease-in-out infinite;
      }

      /* ── Button ───────────────────────────────────────────── */
      .btn {
        position: relative;
        display: inline-flex;
        height: 2rem;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        padding: 0 0.75rem;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font: 500 0.8125rem/1 var(--font-sans);
        letter-spacing: -0.003em;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition:
          transform var(--duration-press) var(--ease-snap),
          background-color var(--duration-quick) ease,
          border-color var(--duration-quick) ease,
          color var(--duration-quick) ease,
          box-shadow var(--duration-quick) ease;
      }
      .btn:has(> svg) {
        padding-inline: 0.625rem 0.75rem;
      }
      /* The shared press: 1px into the page, never for a keyboard press. */
      .btn:active:not(:focus-visible) {
        transform: translateY(1px) scale(0.985);
      }
      .btn:disabled {
        pointer-events: none;
        cursor: default;
        opacity: 0.45;
      }
      /* Pending stays readable: its label is the only word that Stop took. */
      .btn[data-pending] {
        cursor: default;
        box-shadow: none;
        color: var(--muted-foreground);
      }
      .btn.outline {
        border-color: var(--border);
        background: var(--background);
        color: var(--foreground);
      }
      .btn.outline:hover {
        border-color: color-mix(in oklch, var(--foreground) 30%, transparent);
        background: var(--accent);
        color: var(--accent-foreground);
      }
      @media (prefers-color-scheme: dark) {
        .btn.outline {
          background: color-mix(in oklab, var(--input) 15%, transparent);
        }
        .btn.outline:hover {
          background: color-mix(in oklab, var(--input) 30%, transparent);
        }
      }
      /* Arc: the one light. A fill lit from the top left, a specular edge,
         a shaded foot and a short cast. Hover brings the lamp up. */
      .btn.primary {
        isolation: isolate;
        overflow: hidden;
        background-color: var(--primary);
        color: var(--primary-foreground);
        box-shadow: var(--button-shadow);
      }
      .btn.primary::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
        background-image: radial-gradient(
          130% 80% at 0% 0%,
          var(--button-lamp) 0%,
          color-mix(in oklab, var(--button-lamp) 88%, transparent) 10%,
          color-mix(in oklab, var(--button-lamp) 56%, transparent) 25%,
          color-mix(in oklab, var(--button-lamp) 22%, transparent) 50%,
          color-mix(in oklab, var(--button-lamp) 6%, transparent) 65%,
          transparent 80%
        );
        opacity: 0.4;
        transition: opacity var(--duration-quick) ease;
      }
      .btn.primary::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow:
          inset 1px 1px 0 var(--button-specular),
          inset -1px -1px 0 var(--button-shade),
          inset 0 0 0 1px var(--button-rim);
        transition: box-shadow var(--duration-quick) ease;
      }
      @media (hover: hover) {
        .btn.primary:hover {
          background-color: var(--button-fill-lit);
          box-shadow: var(--button-shadow-lit);
        }
        .btn.primary:hover::before {
          opacity: 1;
          transition: opacity var(--duration-quick) var(--ease-snap);
        }
        .btn.primary:hover::after {
          box-shadow:
            inset 1px 1px 0 var(--button-specular-lit),
            inset -1px -1px 0 var(--button-shade),
            inset 0 0 0 1px var(--button-rim);
        }
      }

      /* ── Sections, groups and rows ────────────────────────── */
      .stack > * + * {
        margin-top: 2.5rem;
      }
      @media (min-width: 40rem) {
        .stack > * + * {
          margin-top: 3rem;
        }
      }
      .section > * + * {
        margin-top: 0.75rem;
      }
      .section-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        letter-spacing: -0.025em;
      }
      .section-title.large {
        font-size: 1rem;
        letter-spacing: -0.012em;
      }
      @media (min-width: 40rem) {
        .section-title.large {
          font-size: 1.125rem;
        }
      }
      .count {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground);
      }
      .section-note {
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      /* One group, rows split by hairlines at 60%: never a card per row. */
      .group {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
      }
      .group.card {
        background: var(--card);
      }
      .group > li + li,
      .group > a + a,
      .group > .row + .row {
        border-top: 1px solid color-mix(in oklch, var(--border) 60%, transparent);
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--card);
      }
      .overline {
        font-size: 0.6875rem;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }

      /* Runs: a table at width, stacked on a phone. */
      .runs-head,
      .run-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.25rem 1rem;
        align-items: center;
        padding: 0.75rem 1rem;
      }
      .runs-head {
        display: none;
      }
      .run-row {
        text-decoration: none;
        transition: background-color var(--duration-quick) ease;
      }
      .run-row:hover {
        background: color-mix(in oklch, var(--muted) 60%, transparent);
      }
      .run-name {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.5rem;
      }
      .run-name strong {
        font-weight: 500;
      }
      .run-name > svg {
        color: var(--muted-foreground);
      }
      .run-name > div {
        min-width: 0;
      }
      .run-id {
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      .result {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.25rem 0.5rem;
      }
      .tally {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .facts {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem 1rem;
        padding-left: 1.5rem;
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      .fact {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 0.375rem;
      }
      .fact svg.icon {
        width: 0.875rem;
        height: 0.875rem;
      }
      @media (min-width: 48rem) {
        .runs-head,
        .run-row {
          grid-template-columns: minmax(0, 1fr) 12rem 9rem 10rem 7.5rem;
        }
        .runs-head {
          display: grid;
          height: 2.5rem;
          padding-block: 0;
          border-bottom: 1px solid var(--border);
          font-size: 0.6875rem;
          font-weight: 600;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--muted-foreground);
        }
        .group > .runs-head + .run-row {
          border-top: 0;
        }
        .result {
          justify-content: flex-start;
        }
        .facts {
          display: contents;
        }
      }

      /* A check, as the run report draws it. */
      .check {
        padding: 0.75rem 1rem;
      }
      .check-head {
        display: flex;
        width: 100%;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      button.check-head {
        cursor: pointer;
      }
      .check-head > svg.icon {
        margin-top: 0.125rem;
      }
      .check-body {
        display: block;
        min-width: 0;
        flex: 1;
      }
      .check-desc {
        display: block;
        font-weight: 500;
        line-height: 1.375;
      }
      .check.waiting .check-desc {
        font-weight: 400;
        color: var(--muted-foreground);
      }
      .check-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem;
        margin-top: 0.375rem;
      }
      .check-meta code {
        font-size: 0.6875rem;
        color: var(--muted-foreground);
      }
      .check-meta .badge {
        font-size: 0.625rem;
      }
      .check-side {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 0.5rem;
      }
      .chevron {
        color: var(--muted-foreground);
      }
      .open .chevron {
        transform: rotate(180deg);
      }
      .check-detail {
        display: grid;
        gap: 0.75rem;
        margin-top: 0.5rem;
        padding-left: 1.75rem;
      }
      .evidence {
        color: var(--muted-foreground);
      }
      .evidence.observed {
        color: var(--foreground);
      }
      .cited {
        font-size: 0.75rem;
        color: var(--muted-foreground);
        overflow-wrap: anywhere;
      }
      .shot {
        display: block;
        width: fit-content;
        max-width: min(100%, 36rem);
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--muted);
      }
      .shot img {
        display: block;
        max-width: 100%;
        max-height: 20rem;
        width: auto;
        object-fit: contain;
      }
      .tone-passed {
        color: var(--success-ink);
      }
      .tone-failed {
        color: var(--destructive);
      }
      .tone-error {
        color: var(--warning-ink);
      }
      .tone-informational {
        color: var(--primary);
      }
      .tone-skipped,
      .tone-waiting {
        color: var(--muted-foreground);
      }
      .tone-waiting {
        opacity: 0.6;
      }

      /* The run's score, as RunSummary draws it. */
      .summary {
        padding: 1rem;

      @media (min-width: 40rem) {
        .summary {
          padding: 1.5rem;

      }
      .summary-top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;

        color: var(--muted-foreground);

        align-items: center;
        gap: 0.5rem;

      .meter .failed {
        background: var(--destructive);
      }
      .meter .error {
        background: var(--warning);
      }
      .counts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

        background: color-mix(in oklch, var(--warning) 10%, transparent);
        color: var(--warning-ink);

        display: grid;
        gap: 0.75rem;
        padding: 1rem;
      }
      .live-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem 0.75rem;
      }
      .live-step {
        display: flex;
        min-width: 0;
        flex: 1 1 12rem;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        color: var(--muted-foreground);

      .live-side {
        display: flex;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem 0.75rem;
      }

        flex-basis: 100%;
        font-size: 0.75rem;
        color: var(--destructive);
        text-align: right;

        align-items: center;

        --bulb: 2;
      }
      .chase > span:nth-child(4) {
        --bulb: 3;
      }
      .chase > span:nth-child(5) {
        --bulb: 4;
      }

        height: 2px;
        overflow: hidden;
        border-radius: 9999px;

        display: block;

        background: var(--primary);
      }
      .frame {
        display: block;
        width: 100%;
        max-height: 32rem;
        object-fit: contain;
        object-position: top;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--muted);

      /* Activity: the tool calls, in order. */
      .activity li {
        display: grid;

        padding: 0.5rem 1rem;
        font-size: 0.8125rem;

        font-size: 0.75rem;

        overflow-wrap: anywhere;
        color: var(--muted-foreground);

      .activity summary {
        cursor: pointer;
        white-space: normal;

        align-items: center;
        justify-content: space-between;

        align-items: center;
        gap: 0.5rem;

      /* EmptyState: a framed medallion, a display title, one action. */
      .empty {
        display: flex;
        min-height: 52vh;
        align-items: center;
        justify-content: center;
        padding-inline: 1.5rem;
        text-align: center;

        background: color-mix(in oklch, var(--muted) 60%, transparent);
        color: var(--muted-foreground);

        width: 1.5rem;
        height: 1.5rem;
      }
      .empty h2 {
        font-family: var(--font-display);
        font-size: 1.125rem;
        letter-spacing: -0.035em;
        line-height: 1.1;
      }
      .empty p {
        max-width: 24rem;
        margin: 0.5rem auto 0;
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      .empty code {
        font-size: 0.8125rem;
        color: var(--foreground);
      }
      .inline-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 3rem 1rem;
        text-align: center;
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }
      .inline-empty svg.icon {
        width: 2.5rem;
        height: 2.5rem;
        opacity: 0.5;
      }

      /* ── Motion (motion.css tokens and keyframes) ─────────── */
      .animate-page-in {
        animation: sd-rise var(--duration-slow) var(--ease-drawer) both;
      }
      .animate-rise {
        animation: sd-rise var(--duration-slow) var(--ease-snap) backwards;
      }
      .animate-stamp {
        animation: sd-stamp var(--duration-slow) var(--ease-snap) backwards;
      }
      @keyframes sd-rise {
        from {
          opacity: 0;
          transform: translateY(0.5rem);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sd-stamp {
        0% {
          opacity: 0;
          transform: rotate(-6deg) scale(1.35);
        }
        60% {
          opacity: 0.9;
          transform: rotate(-1.5deg) scale(0.97);
        }
        100% {
          opacity: 0.9;
          transform: rotate(-1.5deg) scale(1);
        }
      }
      @keyframes sd-chase {
        0%,
        100% {
          opacity: 0.18;
          transform: scale(0.8);
        }
        20% {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes marquee-dot {
        0%,
        100% {
          box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 22%, transparent);
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 0 6px color-mix(in oklch, var(--primary) 0%, transparent);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          animation-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }
        .chase > span {
          opacity: 0.6;
        }
      }

      }
      function time(iso, style) {
        const date = new Date(iso);
        if (!iso || Number.isNaN(date.getTime())) return null;
        const exact = dateTime.format(date);
        if (style === 'relative') return h('time', { datetime: iso, title: exact }, ago(date));
        return h('time', { datetime: iso }, style === 'clock' ? clock.format(date) : exact);
      }
      const between = (start, end) => (new Date(end) - new Date(start)) / 1000;
      function took(seconds) {
        seconds = Math.round(seconds);
        if (!(seconds >= 0)) return null;
        if (seconds < 60) return seconds + 's';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm ' + pad(seconds % 60) + 's';
        return Math.floor(minutes / 60) + 'h ' + pad(minutes % 60) + 'm';
      }

      // The run's one headline badge: its verdict once it has one, otherwise
      // where the run got to.
      function runState(run) {
        if (run.status === 'running') return { label: 'Running', tone: 'arc', live: true };
        if (run.status === 'interrupted')
          return { label: 'Interrupted', tone: 'warning', icon: 'alert-triangle' };
        if (run.status === 'failed')
          return { label: 'Run failed', tone: 'destructive', icon: 'octagon-x' };
        const outcome = run.score && run.score.outcome;
        if (!outcome)
          return {
            label: run.status === 'stopped' ? 'Stopped' : run.status,
            tone: 'quiet',
            icon: run.status === 'stopped' ? 'stop' : null,
          };
        const [label, tone, mark] = {
          passed: ['Passed', 'success', 'check-circle'],
          failed: ['Failed', 'destructive', 'x-circle'],
          inconclusive: ['Inconclusive', 'warning', 'alert-triangle'],
        }[outcome];
        return {
          label: run.status === 'stopped' ? label + ', stopped' : label,
          tone,
          icon: mark,
          outcome,
        };
      }
      function stateBadge(run, size) {
        const state = runState(run);
        return h(
          'span',
          { class: 'badge ' + state.tone + (size ? ' ' + size : '') },
          state.live && h('span', { class: 'bulb live', 'aria-hidden': 'true' }),
          state.icon && icon(state.icon),
          state.label
        );
      }

      const inUnit = (value, unit) => (unit == null ? value + '%' : value + ' ' + unit);
      // A checklist with no weights has no score, so the run reads as "3 of 4
      // passed", the same count the finish_run reply gives. Informational and
      // skipped checks are left out, as the scorer leaves them out.
      const tally = (run) => {
        if (run.tally) return run.tally;
        const checks = (run.checklist_snapshot && run.checklist_snapshot.checks) || [];
        const status = Object.fromEntries((run.results || []).map((r) => [r.check, r.status]));
        const scored = checks.filter(
          (c) => c.type !== 'informational' && status[c.key] !== 'skipped'
        );
        return {
          passed: scored.filter((c) => status[c.key] === 'passed').length,
          total: scored.length,
        };
      };
      const scoreText = (score, run) => {
        if (score && score.score != null) return inUnit(score.score, score.unit);
        if (!score || !run || !run.checklist_snapshot) return '';
        const t = tally(run);
        return t.total ? t.passed + ' of ' + t.total + ' passed' : '';
      };

      const runner = (run) =>
        run.runner.kind === 'cloud'
          ? { icon: 'server', label: 'Cloud' }
          : { icon: 'monitor', label: 'Local, self-judged' };
      const checklistName = (run) =>
        run.checklist_name ||
        (run.checklist_snapshot && run.checklist_snapshot.name) ||
        run.checklist;
      const actorName = (run) => run.actor_name || run.actor;

      // What each tool call did, in words. Page reads fold away: they are the
      // page's own text, long and full of refs.
      const ACTIVITY = {
        start_run: 'Started',
        navigate: 'Opened a page',
        read_page: 'Read the page',
        get_page_text: 'Read the page text',
        find: 'Looked for',
        click: 'Clicked',
        type: 'Typed',
        form_input: 'Filled a field',
        key: 'Pressed a key',
        scroll: 'Scrolled',
        screenshot: 'Took a screenshot',
        evaluate_check: 'Judged a check',
        finish_run: 'Finished',
        stop: 'Stopped',
      };
      const PAGE_READS = new Set(['read_page', 'get_page_text', 'find']);

      // How long the actor worked: a resumed run's idle gap left out. Each
      // start_run opens a session that ends at its last line.
      function activeSeconds(run, activity) {
        let total = 0;
        let from = null;
        let last = null;
        for (const line of activity) {
          if (line.tool === 'start_run') {
            if (from && last) total += between(from, last);
            from = line.at;
          }
          last = line.at;
        }
        const end = run.finished_at || last;
        if (from && end) total += between(from, end);
        return activity.length ? total : between(run.started_at, run.finished_at);
      }

      const RESULT = {
        passed: ['Passed', 'success', 'check-circle'],
        failed: ['Failed', 'destructive', 'x-circle'],
        informational: ['Observed', 'arc', 'info'],
        error: ['Not judged', 'warning', 'alert-triangle'],
        skipped: ['Skipped', 'quiet', 'minus-circle'],
      };

      async function getJson(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error((await res.text()) || res.statusText);
        return res.json();
      }

      // A live region outside #app, so a redraw never re-announces the page.
      const status = document.getElementById('status');
      const announce = (text) => {
        if (status.textContent !== text) status.textContent = text;
      };

      // The label stays short so the header does not shift; the command is
      // the button's title.
      async function copy(text, button) {
        const label = button.lastChild;
        label.dataset.label ??= label.textContent;
        let done = 'Copied';
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          done = 'Copy failed';
        }
        label.textContent = done;
        announce(done === 'Copied' ? 'Copied ' + text : done);
        clearTimeout(button.resetLabel);
        button.resetLabel = setTimeout(() => (label.textContent = label.dataset.label), 1600);
      }

      // Set when a Stop is refused, shown beside the button on the next draw.
      let stopError = null;

      function pageHeader({ back, title, badge, description, chips, actions }) {
        return h(
          'header',
          { class: 'page-header' },
          back &&
            h(
              'div',
              { class: 'back' },
              h('a', { href: back.href, 'data-nav': true }, icon('arrow-left'), back.label),
              back.trail && [
                h('span', { class: 'slash', 'aria-hidden': 'true' }, '/'),
                h('span', { class: 'truncate mono' }, back.trail),
              ]
            ),
          h(
            'div',
            { class: 'header-grid' },
            h(
              'div',
              { class: 'header-main' },
              h('div', { class: 'title-row' }, h('h1', { class: 'page-title' }, title), badge),
              description && h('p', { class: 'description' }, description),
              chips &&
                chips.length > 0 &&
                h(
                  'ul',
                  { class: 'chips' },
                  chips.map((chip) =>
                    h(
                      'li',
                      {},
                      h(
                        chip.href ? 'a' : 'span',
                        {
                          class: 'chip',
                          title: chip.title,
                          href: chip.href,
                          target: chip.href && '_blank',
                          rel: chip.href && 'noopener noreferrer',
                        },
                        icon(chip.icon),
                        h('span', { class: 'truncate' + (chip.mono ? ' mono' : '') }, chip.label)
                      )
                    )
                  )
                )
            ),
            actions && h('div', { class: 'actions' }, actions)
          )
        );
      }

      function emptyState(mark, title, ...description) {
        return h(
          'div',
          { class: 'empty' },
          h(
            'div',
            { class: 'frame-marks' },
            h('div', { class: 'medallion' }, icon(mark)),
            h('h2', {}, title),
            h('p', {}, description)
          )
        );
      }

      async function renderRuns() {
        const runs = await getJson('/api/runs');
        if (runs.length === 0) {
          return [
            h('h1', { class: 'sr-only' }, 'Runs'),
            emptyState(
              'checklist',
              'No runs yet',
              'Type ',
              h('code', {}, '/stuntdouble run <checklist>'),
              ' in Claude Code to start one.'
            ),
          ];
        }
        return [
          pageHeader({
            title: 'Runs',
            description: 'Local and cloud runs of this project, newest first.',
          }),
          h(
            'div',
            { class: 'group card' },
            h(
              'div',
              { class: 'runs-head', 'aria-hidden': 'true' },
              h('span', {}, 'Checklist'),
              h('span', {}, 'Result'),
              h('span', {}, 'Actor'),
              h('span', {}, 'Runner'),
              h('span', {}, 'Started')
            ),
            runs.map((entry) =>
              'error' in entry
                ? h(
                    'div',
                    { class: 'run-row' },
                    h(
                      'span',
                      { class: 'run-name' },
                      icon('alert-triangle', 'tone-error'),
                      h('span', { class: 'truncate mono' }, entry.id)
                    ),
                    h(
                      'span',
                      { class: 'result' },
                      h('span', { class: 'badge warning' }, 'Unreadable')
                    ),
                    h('span', { class: 'facts error-text' }, entry.error)
                  )
                : h(
                    'a',
                    {
                      class: 'run-row',
                      href: '/runs/' + encodeURIComponent(entry.id),
                      'data-nav': true,
                    },
                    h(
                      'span',
                      { class: 'run-name' },
                      icon('checklist'),
                      h(
                        'div',
                        {},
                        h(
                          'strong',
                          { class: 'truncate', style: 'display:block' },
                          checklistName(entry)
                        ),
                        h(
                          'span',
                          { class: 'run-id mono truncate', style: 'display:block' },
                          entry.id
                        )
                      )
                    ),
                    h(
                      'span',
                      { class: 'result' },
                      stateBadge(entry),
                      scoreText(entry.score, entry) &&
                        h('span', { class: 'tally' }, scoreText(entry.score, entry))
                    ),
                    h(
                      'span',
                      { class: 'facts' },
                      h(
                        'span',
                        { class: 'fact' },
                        icon('actor'),
                        h('span', { class: 'truncate' }, actorName(entry))
                      ),
                      h(
                        'span',
                        { class: 'fact' },
                        icon(runner(entry).icon),
                        h('span', { class: 'truncate' }, runner(entry).label)
                      ),
                      h('span', { class: 'fact' }, time(entry.started_at, 'relative'))
                    )
                  )
            )
          ),
        ];
      }

      // How a check is judged, beside its key. Silent for a plain pass/fail
      // check, an unconditional one and one that lets the run continue: those
      // are the defaults, and a badge on every row would bury the rest.
      function checkMeta(check) {
        const weight = check.weight ?? 1;
        return h(
          'span',
          { class: 'check-meta' },
          h('code', {}, check.key),
          check.type === 'informational' &&
            h('span', { class: 'badge outline sm' }, icon('info'), 'Observation'),
          check.type === 'weighted' &&
            h(
              'span',
              { class: 'badge outline sm' },
              icon(weight < 0 ? 'minus-circle' : 'scale'),
              h('span', { class: 'mono' }, weight < 0 ? weight + ' penalty' : weight + 'x')
            ),
          check.run_condition &&
            check.run_condition !== 'always' &&
            h(
              'span',
              { class: 'badge outline sm' },
              icon('git-branch'),
              check.run_condition.replaceAll('_', ' ')
            ),
          check.on_failure === 'stop' &&
            h('span', { class: 'badge outline sm' }, icon('octagon-x'), 'Stops the run if it fails')
        );
      }

      // Per page view: which rows a reader opened or closed, and what this
      // tab had already seen of each run, so a redraw keeps the rows as they
      // were and only something that just landed moves.
      const toggled = new Map();
      const seen = new Map();
      // Bumped only when the live frame changes, so a redraw reuses the
      // picture already loaded rather than fetching it again.
      let frameVersion = Date.now();

      function checkRow(run, check, result, opts) {
        if (!result) {
          return h(
            'li',
            { class: 'check waiting' },
            h(
              'div',
              { class: 'check-head' },
              icon(opts.running ? 'pending' : 'circle-dashed', 'tone-waiting'),
              h(
                'span',
                { class: 'check-body' },
                h('span', { class: 'check-desc' }, check.description),
                checkMeta(check)
              ),
              h('span', { class: 'badge quiet sm' }, opts.running ? 'Waiting' : 'Not reached')
            )
          );
        }
        const [label, tone, mark] = RESULT[result.status];
        const shot = result.screenshot && fileUrl('runs/' + run.id + '/' + result.screenshot);
        const key = run.id + ':' + check.key;
        const open = toggled.has(key) ? toggled.get(key) : opts.openByDefault;
        const detail = h(
          'div',
          { class: 'check-detail', id: 'detail-' + check.key, hidden: !open },
          h(
            'p',
            { class: 'evidence' + (result.status === 'informational' ? ' observed' : '') },
            result.evidence
          ),
          result.locator &&
            h(
              'p',
              { class: 'cited mono' },
              'Cited: ' + (result.locator.text || result.locator.selector)
            ),
          shot &&
            h(
              'a',
              {
                class: 'shot',
                href: shot,
                target: '_blank',
                title: 'Open the full-size screenshot',
              },
              h('img', {
                src: shot,
                alt: 'The page when ' + check.key + ' was judged',
                loading: 'lazy',
              })
            )
        );
        const row = h(
          'li',
          { class: 'check' + (open ? ' open' : '') + (opts.arrived ? ' animate-rise' : '') },
          h(
            'button',
            {
              type: 'button',
              class: 'check-head',
              'aria-expanded': String(open),
              'aria-controls': 'detail-' + check.key,
              'aria-labelledby': 'desc-' + check.key + ' label-' + check.key,
              'data-focus-key': 'check:' + check.key,
              onclick: () => {
                const now = detail.hidden;
                toggled.set(key, now);
                detail.hidden = !now;
                row.classList.toggle('open', now);
                row.firstChild.setAttribute('aria-expanded', String(now));
              },
            },
            icon(mark, 'tone-' + result.status),
            h(
              'span',
              { class: 'check-body' },
              h('span', { class: 'check-desc', id: 'desc-' + check.key }, check.description),
              checkMeta(check)
            ),
            h(
              'span',
              { class: 'check-side' },
              opts.earlier &&
                h(
                  'span',
                  { class: 'badge outline sm', title: 'Judged before the run was resumed' },
                  'Earlier'
                ),
              h('span', { class: 'badge sm ' + tone, id: 'label-' + check.key }, label),
              icon('chevron-down', 'chevron')
            )
          ),
          detail
        );
        return row;
      }

      function summaryCard(run, fresh) {
        const score = run.score;
        const state = runState(run);
        if (!score || !state.outcome) return null;
        const weighted = score.score != null;
        const t = tally(run);
        const counts = { passed: 0, failed: 0, error: 0, informational: 0, skipped: 0 };
        for (const r of run.results) counts[r.status]++;
        const judged = counts.passed + counts.failed + counts.error;
        const share = (n) => (judged ? (n / judged) * 100 : 0) + '%';
        return h(
          'section',
          { class: 'card summary', 'aria-label': 'Score' },
          h(
            'div',
            { class: 'summary-top' },
            h(
              'div',
              {},
              h('p', { class: 'overline' }, weighted ? 'Weighted score' : 'Checks passed'),
              h(
                'p',
                {
                  class:
                    'figure tone-' + (state.outcome === 'inconclusive' ? 'error' : state.outcome),
                },
                weighted
                  ? inUnit(score.score, score.unit)
                  : [String(t.passed), h('span', { class: 'of' }, '/' + t.total)]
              ),
              // Unweighted, there is no score: say how the outcome was decided,
              // in the words finish_run uses.
              h(
                'p',
                { class: 'summary-line' },
                !weighted
                  ? 'No score: with no weighted checks, it passes only when every pass/fail check passes'
                  : score.pass_threshold == null
                    ? 'No pass threshold set'
                    : 'Passes at ' + inUnit(score.pass_threshold, score.unit)
              )
            ),
            h(
              'div',
              { class: 'verdict' },
              score.grade && h('span', { class: 'badge outline lg' }, score.grade),
              h(
                'span',
                {
                  class:
                    'badge stamp tone-' +
                    (state.outcome === 'inconclusive' ? 'error' : state.outcome) +
                    (fresh ? ' animate-stamp' : ''),
                },
                state.label
              )
            )
          ),
          h(
            'div',
            { class: 'meter', 'aria-hidden': 'true' },
            ['passed', 'failed', 'error'].map(
              (s) => counts[s] > 0 && h('span', { class: s, style: 'width:' + share(counts[s]) })
            )
          ),
          h(
            'ul',
            { class: 'counts' },
            Object.entries(counts)
              .filter(([, n]) => n > 0)
              .map(([s, n]) =>
                h(
                  'li',
                  {},
                  h(
                    'span',
                    { class: 'badge lg ' + RESULT[s][1] },
                    icon(RESULT[s][2]),
                    h('span', { class: 'mono' }, n),
                    RESULT[s][0]
                  )
                )
              )
          )
        );
      }

      async function renderRun(id) {
        const data = await getJson('/api/runs/' + encodeURIComponent(id));
        if (data.error) {
          return [
            pageHeader({ back: { href: '/', label: 'Runs' }, title: id }),
            h('div', { class: 'notice warning' }, icon('alert-triangle'), h('p', {}, data.error)),
          ];
        }
        const run = data.run;
        const results = new Map(run.results.map((r) => [r.check, r]));
        const checks = run.checklist_snapshot.checks;
        const running = run.status === 'running';
        const resumable = run.status === 'interrupted' || run.status === 'stopped';

        const before = seen.get(run.id);
        seen.set(run.id, { status: run.status, results: new Set(results.keys()) });
        const fresh = before && before.status === 'running' && !running;
        const arrived = (key) => before && !before.results.has(key);

        // Stop sits in the live card, beside the tally, as CancelRunButton does.
        const pending = data.stop_requested;
        const stopButton =
          running &&
          h(
            'button',
            {
              type: 'button',
              class: 'btn outline',
              'aria-disabled': pending && 'true',
              'data-pending': pending,
              'data-focus-key': 'stop',
              onclick: async (event) => {
                const button = event.currentTarget;
                if (button.hasAttribute('data-pending')) return;
                button.setAttribute('aria-disabled', 'true');
                button.setAttribute('data-pending', '');
                button.lastChild.textContent = 'Stopping at the next step';
                stopError = null;
                let res = null;
                try {
                  res = await fetch('/api/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: run.id }),
                  });
                } catch {
                  res = null;
                }
                if (res && (res.ok || res.status === 409)) return; // 409: it already finished
                stopError =
                  res && res.status === 403
                    ? 'Stop was refused. Open the viewer from the link Claude Code gave you.'
                    : 'The run could not be stopped. Try again.';
                announce(stopError);
                render(false);
              },
            },
            icon('stop'),
            h('span', {}, pending ? 'Stopping at the next step' : 'Stop')
          );

        const rerun = '/stuntdouble run ' + run.checklist + (resumable ? ' resume' : '');
        const cloud = '/stuntdouble cloud ' + run.checklist;
        const actions = running
          ? null
          : run.runner.kind === 'local'
            ? [
                h(
                  'button',
                  {
                    type: 'button',
                    class: 'btn outline',
                    title: rerun,
                    'data-focus-key': 'rerun',
                    onclick: (event) => copy(rerun, event.currentTarget),
                  },
                  icon('copy'),
                  h('span', {}, resumable ? 'Copy resume command' : 'Copy re-run command')
                ),
                h(
                  'button',
                  {
                    type: 'button',
                    class: 'btn outline',
                    title: cloud,
                    'data-focus-key': 'cloud',
                    onclick: (event) => copy(cloud, event.currentTarget),
                  },
                  icon('copy'),
                  h('span', {}, 'Copy cloud command')
                ),
              ]
            : webUrl(run.runner.url)
              ? [
                  h(
                    'a',
                    {
                      class: 'btn outline',
                      href: run.runner.url,
                      target: '_blank',
                      rel: 'noopener noreferrer',
                    },
                    icon('external-link'),
                    h('span', {}, 'Open this run in Stunt Double')
                  ),
                ]
              : null;

        const starts = data.activity.filter((line) => line.tool === 'start_run');
        const sessions = starts.length;
        const duration =
          run.finished_at &&
          took(activeSeconds(run, data.activity)) +
            (sessions > 1 ? ' over ' + sessions + ' sessions' : '');
        // Resumed: the verdicts from before the last start_run stood.
        const resumedAt = sessions > 1 ? new Date(starts[sessions - 1].at) : null;
        const earlier = (result) => resumedAt && result.at && new Date(result.at) < resumedAt;
        const header = pageHeader({
          back: { href: '/', label: 'Runs', trail: run.id },
          title: checklistName(run),
          // A finished run's verdict is the score card's stamp: once is enough.
          badge: run.score && runState(run).outcome ? null : stateBadge(run, 'lg'),
          chips: [
            { icon: runner(run).icon, label: runner(run).label },
            { icon: 'actor', label: actorName(run), title: 'Actor' },
            { icon: 'globe', label: run.url, href: webUrl(run.url), title: 'Target' },
            { icon: 'calendar', label: time(run.started_at), title: 'Started' },
            duration && {
              icon: 'timer',
              label: duration,
              mono: true,
              title: 'How long the actor worked, idle time between sessions left out',
            },
          ].filter(Boolean),
          actions,
        });

        const judged = run.results.length;
        const checked = pad(judged) + ' of ' + pad(checks.length) + ' checked';
        if (running) announce(stopError || judged + ' of ' + checks.length + ' checked');
        else if (fresh) announce(runState(run).label);
        if (!running) stopError = null;
        const live =
          running &&
          h(
            'section',
            { class: 'card live-card', 'aria-label': 'Live' },
            h(
              'div',
              { class: 'live-head' },
              h(
                'p',
                { class: 'live-step' },
                h('span', { class: 'chase', role: 'img', 'aria-label': 'Run in progress' }, [
                  h('span'),
                  h('span'),
                  h('span'),
                  h('span'),
                  h('span'),
                ]),
                h(
                  'span',
                  { class: 'truncate' },
                  data.activity.length > 0
                    ? data.activity[data.activity.length - 1].text.split('\n')[0]
                    : 'Running'
                )
              ),
              h(
                'span',
                { class: 'live-side' },
                h(
                  'span',
                  { class: 'badge arc' },
                  h('span', { class: 'bulb live', 'aria-hidden': 'true' }),
                  'Live'
                ),
                h('span', { class: 'tally' }, checked),
                stopButton,
                stopError && h('span', { class: 'stop-error' }, stopError)
              )
            ),
            h(
              'div',
              {
                class: 'progress',
                role: 'progressbar',
                'aria-label': 'Run progress',
                'aria-valuemin': 0,
                'aria-valuemax': checks.length,
                'aria-valuenow': judged,
              },
              h('span', {
                style: 'width:' + (checks.length ? (judged / checks.length) * 100 : 0) + '%',
              })
            ),
            h('img', {
              class: 'frame',
              id: 'frame',
              src: fileUrl('.live/latest.png') + '?v=' + frameVersion,
              alt: 'The browser now',
            })
          );

        // What went wrong first, since that is what somebody opens a report to
        // find, then what held, then what was only read off the page, then what
        // never ran.
        const groups = [
          ['Needs attention', ['failed', 'error'], true],
          ['Passed', ['passed'], false],
          ['Observations', ['informational'], true],
          ['Skipped', ['skipped'], false],
        ]
          .map(([title, statuses, openByDefault]) => ({
            title,
            openByDefault,
            checks: checks.filter(
              (c) => results.has(c.key) && statuses.includes(results.get(c.key).status)
            ),
          }))
          .concat({
            title: running ? 'Still to check' : 'Not reached',
            checks: checks.filter((c) => !results.has(c.key)),
          })
          .filter((g) => g.checks.length > 0);

        const notice =
          run.summary &&
          (run.status === 'failed'
            ? h('div', { class: 'notice destructive' }, icon('octagon-x'), h('p', {}, run.summary))
            : h('p', { class: 'quote' }, run.summary));

        return [
          header,
          h(
            'div',
            { class: 'stack' },
            live,
            notice,
            summaryCard(run, fresh),
            groups.map((group) =>
              h(
                'section',
                { class: 'section' },
                h(
                  'h2',
                  { class: 'section-title' },
                  group.title,
                  h('span', { class: 'count' }, pad(group.checks.length))
                ),
                h(
                  'ul',
                  { class: 'group' },
                  group.checks.map((check) =>
                    checkRow(run, check, results.get(check.key), {
                      running,
                      openByDefault: group.openByDefault,
                      arrived: results.has(check.key) && arrived(check.key),
                      earlier: results.has(check.key) && earlier(results.get(check.key)),
                    })
                  )
                )
              )
            ),
            data.activity.length > 0 &&
              h(
                'section',
                { class: 'section' },
                h(
                  'h2',
                  { class: 'section-title' },
                  'Activity',
                  h('span', { class: 'count' }, pad(data.activity.length))
                ),
                h(
                  'ol',
                  { class: 'group activity' },
                  data.activity.map((line) =>
                    h(
                      'li',
                      {},
                      time(line.at, 'clock'),
                      h('span', { title: line.tool }, ACTIVITY[line.tool] || line.tool),
                      PAGE_READS.has(line.tool)
                        ? h(
                            'details',
                            { class: 'text' },
                            h(
                              'summary',
                              {},
                              line.tool === 'find' && line.input && line.input.query
                                ? '"' + line.input.query + '": show matches'
                                : 'Show page text'
                            ),
                            line.text
                          )
                        : h('span', { class: 'text' }, line.text)
                    )
                  )
                )
              )
          ),
        ];
      }

      function definitionError(entry) {
        return h(
          'li',
          { class: 'def' },
          h(
            'div',
            { class: 'def-head' },
            h(
              'span',
              { class: 'def-name' },
              icon('alert-triangle', 'tone-error'),
              h('code', {}, entry.slug)
            ),
            h('span', { class: 'badge warning' }, 'Unreadable')
          ),
          h('p', { class: 'def-body error-text' }, entry.error)
        );
      }

      async function renderDefinitions() {
        const { checklists, actors } = await getJson('/api/definitions');
        const cloudIds = (cloud) =>
          cloud && Object.values(cloud).some((v) => v && typeof v !== 'object')
            ? h('span', { class: 'badge arc' }, 'Linked to the cloud')
            : h('span', { class: 'badge secondary' }, 'Local only');
        const section = (title, entries, mark, empty, row) =>
          h(
            'section',
            { class: 'section' },
            h(
              'h2',
              { class: 'section-title large' },
              title,
              h('span', { class: 'count' }, pad(entries.length))
            ),
            entries.length === 0
              ? h('div', { class: 'card inline-empty' }, icon(mark), h('p', {}, empty))
              : h(
                  'ul',
                  { class: 'group card' },
                  entries.map((entry) => (entry.error ? definitionError(entry) : row(entry)))
                )
          );
        return [
          pageHeader({
            title: 'Checklists and actors',
            description:
              'Read only. Edit them in Claude Code: they are the JSON files in .stuntdouble/.',
          }),
          h(
            'div',
            { class: 'stack' },
            section('Checklists', checklists, 'checklist', 'No checklists yet.', (entry) =>
              h(
                'li',
                { class: 'def' },
                h(
                  'div',
                  { class: 'def-head' },
                  h(
                    'span',
                    { class: 'def-name' },
                    icon('checklist'),
                    h('span', { class: 'truncate' }, entry.data.name)
                  ),
                  cloudIds(entry.data.cloud)
                ),
                h(
                  'div',
                  { class: 'def-facts' },
                  h('code', {}, entry.slug),
                  h('span', { class: 'fact' }, icon('actor'), 'Run by ' + entry.data.actor),
                  h('span', { class: 'fact' }, icon('globe'), entry.data.url)
                ),
                h('p', { class: 'def-body' }, entry.data.instructions),
                h(
                  'ul',
                  { class: 'def-checks' },
                  entry.data.checks.map((c) =>
                    h('li', {}, h('span', {}, c.description), checkMeta(c))
                  )
                )
              )
            ),
            section('Actors', actors, 'actor', 'No actors yet.', (entry) =>
              h(
                'li',
                { class: 'def' },
                h(
                  'div',
                  { class: 'def-head' },
                  h(
                    'span',
                    { class: 'def-name' },
                    icon('actor'),
                    h('span', { class: 'truncate' }, entry.data.name)
                  ),
                  cloudIds(entry.data.cloud)
                ),
                h(
                  'div',
                  { class: 'def-facts' },
                  h('code', {}, entry.slug),
                  entry.data.persist_login && h('span', {}, 'Keeps its logins')
                ),
                entry.data.description && h('p', { class: 'def-body' }, entry.data.description),
                entry.data.knowledge.length > 0 &&
                  h(
                    'p',
                    { class: 'def-body fact' },
                    icon('knowledge'),
                    'Knows: ' + entry.data.knowledge.map((k) => k.title).join(', ')
                  )
              )
            )
          ),
        ];
      }

      let rendering = Promise.resolve();
      function render(enter) {
        rendering = rendering.then(async () => {
          const path = location.pathname;
          for (const link of document.querySelectorAll('.bar nav a')) {
            const current = link.getAttribute('href') === (path.startsWith('/runs/') ? '/' : path);
            if (current) link.setAttribute('aria-current', 'page');
            else link.removeAttribute('aria-current');
          }
          let view;
          try {
            view = path.startsWith('/runs/')
              ? await renderRun(decodeURIComponent(path.slice('/runs/'.length)))
              : path === '/definitions'
                ? await renderDefinitions()
                : await renderRuns();
          } catch (err) {
            view = [
              h('div', { class: 'notice destructive' }, icon('octagon-x'), h('p', {}, err.message)),
            ];
          }
          app.classList.toggle('narrow', path === '/definitions');
          // A live redraw replaces the view: keep keyboard focus where it was.
          const focused = document.activeElement?.closest?.('[data-focus-key]');
          const focusKey = focused && app.contains(focused) && focused.dataset.focusKey;
          app.replaceChildren(...[view].flat(2).filter(Boolean));
          if (focusKey) {
            app
              .querySelector('[data-focus-key="' + CSS.escape(focusKey) + '"]')
              ?.focus({ preventScroll: true });
          }
          // A view the reader went to rises in once. Redraws for live updates,
          // and anything reached from the keyboard, cut.
          if (enter) {
            app.classList.remove('animate-page-in');
            void app.offsetWidth;
            app.classList.add('animate-page-in');
          }
        });
      }

      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[data-nav]');
        if (!link || event.metaKey || event.ctrlKey) return;
        event.preventDefault();
        history.pushState(null, '', link.getAttribute('href'));
        window.scrollTo(0, 0);
        render(event.detail > 0);
      });
      window.addEventListener('popstate', () => render(false));

      // Live updates: a new frame swaps the picture, anything else redraws the
      // page. The server already coalesces changes, so a redraw waits only long
      // enough to fold a burst into one.
      let queued = false;
      new EventSource('/api/events').onmessage = (event) => {
        const { paths } = JSON.parse(event.data);
        if (paths.includes('.live/latest.png')) {
          frameVersion++;
          const frame = document.getElementById('frame');
          if (frame) frame.src = fileUrl('.live/latest.png') + '?v=' + frameVersion;
        }
        if (paths.every((p) => p.startsWith('.live/')) || queued) return;
        queued = true;
        setTimeout(() => {
          queued = false;
          render(false);
        }, 50);
      };
      // Relative times on the runs list stay current.
      setInterval(() => location.pathname === '/' && render(false), 60_000);
      render(false);
    </script>
  </body>
</html>
